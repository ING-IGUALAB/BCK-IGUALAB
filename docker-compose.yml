services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy_net:
    external: true
