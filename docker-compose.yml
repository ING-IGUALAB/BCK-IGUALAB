services:
  backend:
    # Jenkins construye la imagen una sola vez (ci/construir-imagen.sh), la analiza con Trivy y la despliega con BACKEND_IMAGE y
    # `up --no-build --pull never`: se ejecuta exactamente la imagen analizada. Sin BACKEND_IMAGE (uso local) `build` sigue funcionando.
    image: ${BACKEND_IMAGE:-igualab-backend:local}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy_net:
    external: true
