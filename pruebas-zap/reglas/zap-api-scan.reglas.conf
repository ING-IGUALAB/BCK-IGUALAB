# Reglas de zap-api-scan.py (ZAP 2.17.0) para el backend de Igualab. Formato oficial: <id>TAB<NIVEL>TAB(<mensaje>).
# Niveles: FAIL (el build falla, codigo 1) - WARN (build INESTABLE, codigo 2) - IGNORE (la regla NO se ejecuta) - INFO.
# Toda regla NO listada queda en WARN (valor por defecto del script oficial; no se usa -i). Al pasar este archivo con -c, el script
# activa TODAS las reglas activas de 'Default Policy' salvo las marcadas IGNORE (no se usa la politica minima API-Minimal).
#
# Criterio:
#   FAIL   = clases de vulnerabilidad de inyeccion/ejecucion con deteccion de alta confianza: un hallazgo es defecto de seguridad real.
#   WARN   = revision humana obligatoria (cabeceras, divulgacion, errores 5xx, etc.): pueden ser falsos positivos o depender del proxy.
#   IGNORE = solo si la regla no puede aplicarse sin salir del alcance autorizado, o por indicacion expresa y documentada (40025). NO se ignora ninguna alerta por incomodidad.
# No se debe pasar un FAIL a WARN/IGNORE para obtener un build verde: corrija el defecto o documente la excepcion aqui con su motivo.
#
# == FAIL: inyeccion SQL ==
40018	FAIL	(SQL Injection)
40019	FAIL	(SQL Injection - MySQL)
40020	FAIL	(SQL Injection - Hypersonic)
40021	FAIL	(SQL Injection - Oracle)
40022	FAIL	(SQL Injection - PostgreSQL)
40024	FAIL	(SQL Injection - SQLite)
40027	FAIL	(SQL Injection - MsSQL)
# == FAIL: XSS, ejecucion de codigo y de comandos, lectura de ficheros ==
40012	FAIL	(Cross Site Scripting (Reflected))
40014	FAIL	(Cross Site Scripting (Persistent))
6	FAIL	(Path Traversal)
7	FAIL	(Remote File Inclusion)
90019	FAIL	(Server Side Code Injection)
90020	FAIL	(Remote OS Command Injection)
90021	FAIL	(XPath Injection)
90023	FAIL	(XML External Entity Attack)
90025	FAIL	(Expression Language Injection)
90035	FAIL	(Server Side Template Injection)
90036	FAIL	(Server Side Template Injection (Blind))
40009	FAIL	(Server Side Include)
#
# == IGNORE = COBERTURA EXCLUIDA (la regla NO se ejecuta). Pendiente de decision del TA. ==
# Reglas 40043 (Log4Shell), 40046 (SSRF) y 40047 (Text4Shell): dependen de OAST: ZAP registra un dominio de retrollamada en un servicio externo de terceros y el backend de
# QA tendria que contactarlo, lo que saca trafico de QA hacia Internet y esta fuera del alcance autorizado.
# IMPORTANTE: que no haya alertas de estas reglas NO significa que las vulnerabilidades hayan sido descartadas; significa que NO
# SE EVALUARON. En particular SSRF queda SIN CUBRIR por el escaneo automatico y necesita otra evidencia (revision del codigo o una
# prueba con OAST interno autorizado). Log4Shell y Text4Shell son defectos de librerias Java: el stack del backend (Python) hace
# improbable que apliquen, pero eso es un argumento de diseno, no un resultado de ZAP.
# Comprobado en local con la imagen fijada (ZAP 2.17.0, 53 reglas activas): 40043 SI existe (se observo su SKIP) y 40025, 40046 y 40047
# NO existen en esa imagen. Para estas tres el IGNORE es PREVENTIVO (por si un complemento beta las anade al actualizarse en ejecucion)
# y no implica que se hayan evaluado: en esta imagen, SSRF y Proxy Disclosure no se evaluan de ninguna forma.
# Regla 40025 (Proxy Disclosure): BYPASS indicado por el asesor del curso para todo el grupo. Al escanear a traves del proxy Caddy
# la regla informa de la existencia del proxy (riesgo Medium) y eso es esperado en este despliegue, no un defecto de la aplicacion.
# Es la UNICA excepcion de este tipo. Al ser IGNORE la regla NO se ejecuta: no se evalua si el proxy o su version quedan expuestos;
# no es un descarte ni una conclusion de seguridad. Revisar la exposicion del proxy publico por otro medio (cabeceras Via/Server).
40025	IGNORE	(Proxy Disclosure: NO evaluada por indicacion del asesor del curso - proxy Caddy esperado; no es un descarte)
40043	IGNORE	(Log4Shell: NO evaluada - requiere OAST externo; no es un descarte)
40046	IGNORE	(SSRF: NO evaluada - requiere OAST externo; cobertura pendiente de decision del TA, no es un descarte)
40047	IGNORE	(Text4Shell: NO evaluada - requiere OAST externo; no es un descarte)
#
# == WARN explicito: senales que ZAP emite sobre las respuestas HTTP y que requieren criterio humano ==
100000	WARN	(Script de ZAP: respuesta 5xx durante el fuzzing (las 4xx son Informational y el script oficial las descarta); un 5xx indica error no controlado)
100001	WARN	(Script de ZAP: Content-Type inesperado para una API)
90022	WARN	(Application Error Disclosure: revisar si hay trazas internas en las respuestas)
10096	WARN	(Timestamp Disclosure: frecuente falso positivo en campos de fecha de la API)
10020	WARN	(Anti-clickjacking: depende de las cabeceras que anada el proxy publico (no visibles en la URL interna HTTP))
10021	WARN	(X-Content-Type-Options ausente: puede anadirlo el proxy publico)
10038	WARN	(Content Security Policy ausente: puede anadirla el proxy publico)
10035	WARN	(Strict-Transport-Security ausente: solo es verificable en el endpoint publico HTTPS, no en la URL interna HTTP)
